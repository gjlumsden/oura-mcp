version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src/OuraMcp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    labels:
      - "dependencies"
      - ".NET"
    commit-message:
      prefix: "chore(deps)"
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
      microsoft-runtime:
        patterns:
          - "Microsoft.*"
          - "System.*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "nuget"
    directory: "/tests/OuraMcp.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/London"
    labels:
      - "dependencies"
      - ".NET"
    commit-message:
      prefix: "chore(deps-dev)"
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
      test-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/London"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
